<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Digital Services</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: linear-gradient(135deg, #061a45, #0878d1);
      color: white;
      text-align: center;
      padding: 55px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 12px;
    }

    header p {
      font-size: 18px;
      opacity: 0.95;
    }

    .container {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .intro {
      text-align: center;
      margin-bottom: 30px;
    }

    .intro h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .services {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 35px;
    }

    .service {
      background: white;
      padding: 22px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      text-align: center;
    }

    .service h3 {
      margin-bottom: 8px;
      color: #0878d1;
    }

    .form-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .form-box h2 {
      margin-bottom: 20px;
      color: #061a45;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccd5e0;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: #0878d1;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #0878d1;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #055fa8;
    }

    footer {
      margin-top: 50px;
      background: #061a45;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .success {
      display: none;
      background: #e7f8ed;
      color: #16723b;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>PRIME DIGITAL SERVICES</h1>
  <p>Your Vision • Our Digital Expertise</p>
</header>

<div class="container">

  <div class="intro">
    <h2>What Can We Do For You?</h2>
    <p>Professional digital solutions for individuals and businesses.</p>
  </div>

  <div class="services">

    <div class="service">
      <h3>🌐 Websites</h3>
      <p>Professional websites for businesses and individuals.</p>
    </div>

    <div class="service">
      <h3>📄 CVs</h3>
      <p>Professional and modern CVs
